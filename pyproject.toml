[project]
name = "adw-infrastructure"
version = "1.0.0"
description = "AI Developer Workflow - Automated GitHub issue to PR pipeline using Claude Code CLI"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # ================================
    # Core ADW Dependencies
    # ================================
    "pydantic>=2.0.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",

    # ================================
    # GitHub Integration
    # ================================
    # Uses `gh` CLI (install separately)

    # ================================
    # Optional: R2/S3 Upload Support
    # ================================
    "boto3>=1.34.0,<2.0.0",

    # ================================
    # Cron Trigger Support
    # ================================
    "schedule>=1.2.0,<2.0.0",

    # ================================
    # Webhook Server (optional)
    # ================================
    "fastapi>=0.109.0,<1.0.0",
    "uvicorn>=0.27.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "ruff>=0.1.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adws"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
